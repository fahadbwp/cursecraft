<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#0b0f17" stroke="#161f30" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Background Flat Grid -->
  <rect width="1280" height="720" fill="url(#grid)" />
  
  <!-- Banner Label -->
  <rect x="20" y="20" width="340" height="40" rx="6" fill="#1e293b" opacity="0.9" stroke="#334155"/>
  <text x="35" y="46" font-family="monospace" font-size="14" fill="#94a3b8" font-weight="bold">PHASE 1: BARREN ARENA (BEFORE)</text>
  
  <!-- Note text -->
  <text x="640" y="120" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">
    Featureless flat stone grid with zero landmarks, no paths, no foliage, and no environmental depth
  </text>
  
  <!-- Player in center -->
  <circle cx="640" cy="360" r="18" fill="#38bdf8" stroke="#0284c7" stroke-width="3" />
  <!-- Simple slash -->
  <path d="M 665 335 A 35 35 0 0 1 665 385" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Scattered simple bat enemies -->
  <circle cx="500" cy="280" r="14" fill="#a855f7" />
  <circle cx="800" cy="450" r="14" fill="#a855f7" />
  <circle cx="460" cy="480" r="14" fill="#a855f7" />
</svg>